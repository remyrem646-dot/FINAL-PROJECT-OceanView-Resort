{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Ocean View Resort and Beach – Batangas" />
  <title>Ocean View | Resort and Beach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Marcellus&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/home.css' %}" />
</head>
<body>

  <header class="site-header" id="site-header">
    <!-- Clicking the Ocean View name always goes back to this first page -->
    <a class="brand" href="{% url 'home' %}" aria-label="Ocean View – back to the main page">
      <span class="brand-name"><span>Ocean</span><span>View</span></span>
      <span class="brand-rule" aria-hidden="true"></span>
    </a>

    <button class="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="main-nav">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>

    {# Home opens the Welcome page. The other links are placeholders until those pages exist. #}
    <nav id="main-nav" class="main-nav" aria-label="Main navigation">
     <a href="{% url 'welcome' %}">Home</a>
     <a href="#">Room &amp; Suites</a>
     <a href="#">Amenities</a>
     <a href="#">Special Rates</a>
     <a href="#">Location</a>
     <a href="#">Gallery</a>
    </nav>
  </header>

  <main class="hero">
    <section class="title-card" aria-label="Welcome to Ocean View">
      <h1>Ocean<br />View</h1>
      <span class="rule" aria-hidden="true"></span>
      <p class="tagline">Resort and Beach</p>
    </section>
  </main>

  <script>
    const header = document.getElementById('site-header');
    const toggle = header.querySelector('.menu-toggle');
    const nav = document.getElementById('main-nav');

    function setMenu(open) {
      nav.classList.toggle('open', open);
      toggle.setAttribute('aria-expanded', open);
      toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    }

    toggle.addEventListener('click', () => setMenu(!nav.classList.contains('open')));
    nav.addEventListener('click', (e) => { if (e.target.closest('a')) setMenu(false); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false); });
    document.addEventListener('click', (e) => { if (!header.contains(e.target)) setMenu(false); });
  </script>
</body>
</html>
